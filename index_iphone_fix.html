<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>差枚グラフ20台解析</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#101827;color:#eaf2ff;margin:0;padding:14px;max-width:760px;margin:auto}h1{font-size:22px;margin:10px 0}.card{background:#1d2b40;padding:14px;border-radius:12px;margin:12px 0}label{display:block;font-size:13px;color:#bdcde0;margin:8px 0 4px}input,button,textarea{box-sizing:border-box;font:inherit;border-radius:8px}input[type=file]{width:100%}input[type=number],input[type=text]{background:#0c1727;color:white;border:1px solid #64748b;padding:9px;width:100%}button{background:#22c55e;color:#06130c;font-weight:700;padding:11px;border:0;margin:5px 4px 5px 0}button.secondary{background:#cbd5e1;color:#111827}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}small,.note{color:#a9bbd2;line-height:1.6}.row{display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px;background:#122033;border-radius:9px}.row canvas{width:100px;max-width:35%;height:auto;border:1px solid #667085}.row .details{flex:1}.row input{width:100%;padding:7px}#preview{width:100%;height:auto;max-height:400px;object-fit:contain}textarea{width:100%;height:170px;background:#081525;color:#d8f9dd;border:1px solid #64748b;padding:10px}#status{white-space:pre-wrap}b.good{color:#86efac}.warn{color:#fbbf24}</style></head><body><h1>📈 差枚グラフ 20台解析 β（iPhone修正版）</h1><p class="note">保存済みの「出玉推移一覧」スクショを端末内で解析します。画像はサーバーへ送信しません。差枚は推定値です。</p><div class="card"><label>① スクリーンショットを選択</label><input id="file" type="file" accept="image/*"><div class="grid"><div><label>先頭台番（左上）</label><input id="start" type="number" value="461"></div><div><label>日付（任意）</label><input id="date" type="text" value="11/8"></div></div><div class="grid"><div><label>±5000枚の距離補正（倍率）</label><input id="scale" type="number" min="0.5" max="1.5" step="0.01" value="1.00"></div><div><label>丸め単位（枚）</label><input id="round" type="number" min="1" step="50" value="100"></div></div><button id="run" disabled>② 20台を自動解析</button><button id="reset" class="secondary">補正値を戻す</button><div id="status" class="note">画像を選択してください。</div></div><div class="card"><details><summary>画像プレビュー</summary><img id="preview" alt="選択画像"></details></div><div class="card"><h2>③ 推定結果（修正可能）</h2><p class="note">黄色線の右端を検出します。線が短い台や0枚付近は誤差が出やすいので、画像と照合してください。黄色い「最大獲得枚数」は使いません。</p><div id="rows"></div></div><div class="card"><h2>④ 一括コピー</h2><p class="note">台番,推定差枚（Googleスプレッドシート貼付用）</p><textarea id="output" readonly></textarea><button id="copy">コピー</button><button id="download" class="secondary">CSV保存</button></div><script>
'use strict';let source=null,rects=[],results=[];const $=id=>document.getElementById(id);const status=s=>$('status').textContent=s;function rgbDark(r,g,b){return r<115&&g<115&&b<115}function yellow(r,g,b){return r>105&&g>95&&b<150&&r>g*1.04&&g>b*1.4}function segments(flags,minLen,gap){let a=[],start=-1,last=-1;for(let i=0;i<flags.length;i++){if(flags[i]){if(start<0)start=i;last=i}else if(start>=0&&i-last>gap){if(last-start+1>=minLen)a.push([start,last]);start=-1;last=-1}}if(start>=0&&last-start+1>=minLen)a.push([start,last]);return a}function median(a){a=[...a].sort((x,y)=>x-y);return a[Math.floor(a.length/2)]}function detect(im){const {width:w,height:h,data:d}=im;const sample=(x,y)=>{let k=(y*w+x)*4;return [d[k],d[k+1],d[k+2]]};let candidates=[];for(let fx of [.22,.77]){let x=Math.floor(w*fx),fl=[];for(let y=0;y<h;y++){let [r,g,b]=sample(x,y);fl.push(rgbDark(r,g,b))}let ss=segments(fl,Math.round(w*.17),Math.max(5,Math.round(w*.016)));candidates.push(ss.filter(([a,b])=>a>h*.07&&b<h*.94&&b-a>w*.17&&b-a<w*1.15))}let groups=candidates[0].map(([a,b])=>[a,b]);if(groups.length<2)throw Error('グラフの縦位置を検出できませんでした。一覧スクショ全体を選んでください。');let rect=[];for(let [top,bot] of groups){let mid=Math.floor((top+bot)/2);let runs=[];let fl=[];for(let x=0;x<w;x++){let [r,g,b]=sample(x,mid);fl.push(rgbDark(r,g,b))}runs=segments(fl,Math.round(w*.12),Math.max(2,Math.round(w*.006)));runs=runs.filter(([a,b])=>b-a>w*.2&&b-a<w*.65);if(runs.length>=2){runs.sort((a,b)=>a[0]-b[0]);for(let [x1,x2] of runs.slice(0,2))rect.push({x:x1,y:top,w:x2-x1+1,h:bot-top+1})}else{rect.push({x:Math.round(w*.035),y:top,w:Math.round(w*.45),h:bot-top+1},{x:Math.round(w*.515),y:top,w:Math.round(w*.45),h:bot-top+1})}}return rect.slice(0,20)}function analyze(im,r){let {width:w,data:d}=im;let get=(x,y)=>{let k=(y*w+x)*4;return [d[k],d[k+1],d[k+2]]};let z=[];for(let y=r.y+Math.floor(r.h*.25);y<r.y+Math.floor(r.h*.72);y++){let n=0;for(let x=r.x+Math.floor(r.w*.08);x<r.x+Math.floor(r.w*.88);x+=2){let [R,G,B]=get(x,y);if(R>130&&G>130&&B>130&&Math.max(R,G,B)-Math.min(R,G,B)<35)n++}z.push([n,y])}z.sort((a,b)=>b[0]-a[0]);let zero=z[0][1];let ys=[],lastX=-1;let xmax=r.x+Math.floor(r.w*.91);for(let x=r.x+Math.floor(r.w*.035);x<xmax;x++){for(let y=r.y+Math.floor(r.h*.06);y<r.y+Math.floor(r.h*.81);y++){let [R,G,B]=get(x,y);if(yellow(R,G,B)){if(x>lastX){lastX=x;ys=[]}if(x>=lastX-2)ys.push(y)}}}let yend=ys.length?median(ys.filter(y=>y>=r.y+r.h*.06&&y<=r.y+r.h*.81)):null;let per5000=r.h*.40*Number($('scale').value||1);let val=yend===null?null:Math.round(((zero-yend)*5000/per5000)/Number($('round').value||100))*Number($('round').value||100);return {zero,yend,val,lastX,confidence:yend===null?'線未検出':lastX<r.x+r.w*.20?'短い線':'推定'}}function output(){let start=Number($('start').value||0);$('output').value=results.map((v,i)=>`${start+i},${v.val===null?'':v.val}`).join('\n')}function show(){let el=$('rows');el.innerHTML='';results.forEach((r,i)=>{let item=document.createElement('div');item.className='row';let c=document.createElement('canvas');let a=rects[i];c.width=a.w;c.height=a.h;c.getContext('2d').drawImage(source,a.x,a.y,a.w,a.h,0,0,a.w,a.h);let det=document.createElement('div');det.className='details';let title=document.createElement('strong');title.textContent=`${Number($('start').value||0)+i}番台`;let hint=document.createElement('div');hint.className=r.confidence==='推定'?'note':'warn';hint.textContent=r.confidence;let inp=document.createElement('input');inp.type='number';inp.placeholder='要確認';inp.value=r.val??'';inp.addEventListener('input',()=>{results[i].val=inp.value===''?null:Number(inp.value);output()});det.append(title,hint,inp);item.append(c,det);el.append(item)});output()}let imageLoadToken=0;
$('file').addEventListener('change',e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 const token=++imageLoadToken;source=null;$('run').disabled=true;$('preview').removeAttribute('src');
 status(`画像を読み込み中… (${f.name}, ${(f.size/1048576).toFixed(1)}MB)`);
 const timer=setTimeout(()=>{if(token===imageLoadToken&&!source)status('読み込みがタイムアウトしました。SafariでPNGまたはJPEG画像を試してください。')},12000);
 const reader=new FileReader();
 reader.onerror=()=>{clearTimeout(timer);status('ファイル読み取りエラー：'+(reader.error?.message||'不明'))};
 reader.onload=()=>{
  if(token!==imageLoadToken)return;
  const im=new Image();
  im.onerror=()=>{clearTimeout(timer);status('画像の形式をデコードできませんでした。スクショをPNG/JPEGで保存して試してください。')};
  im.onload=()=>{
   if(token!==imageLoadToken)return;
   clearTimeout(timer);
   try{
    // iPhone Safari の大画像Canvasメモリ不足を避けるため最大長辺2400pxに縮小
    const maxSide=2400,ratio=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.naturalWidth*ratio));cv.height=Math.max(1,Math.round(im.naturalHeight*ratio));
    const ctx=cv.getContext('2d');if(!ctx)throw Error('Canvasを作成できません');ctx.drawImage(im,0,0,cv.width,cv.height);
    source=cv;
    $('preview').src=reader.result;
    $('run').disabled=false;
    status(`画像読み込み成功：${im.naturalWidth}×${im.naturalHeight}px（解析用 ${cv.width}×${cv.height}px）。解析ボタンを押してください。`);
   }catch(err){status('画像準備エラー：'+err.message)}
  };
  im.src=reader.result;
 };
 reader.readAsDataURL(f);
});
$('run').onclick=()=>{try{if(!source)return;let cv=document.createElement('canvas');cv.width=source.width;cv.height=source.height;let ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(source,0,0);let im=ctx.getImageData(0,0,cv.width,cv.height);rects=detect(im);results=rects.map(r=>analyze(im,r));show();status(`${results.length}台を解析しました。結果を確認・修正してからコピーしてください。`)}catch(e){status('解析エラー：'+e.message)}};$('start').addEventListener('input',()=>{if(results.length)show()});$('reset').onclick=()=>{$('scale').value='1.00';$('round').value='100';if(source)$('run').click()};$('copy').onclick=async()=>{let s=$('output').value;try{await navigator.clipboard.writeText(s);status('コピーしました！')}catch(e){$('output').focus();$('output').select();status('テキストを選択しました。長押しでコピーしてください。')}};$('download').onclick=()=>{let blob=new Blob(['\ufeff'+$('output').value],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='samai.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></body></html>
